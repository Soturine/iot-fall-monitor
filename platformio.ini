; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
extra_scripts = pre:scripts/pio-pre-upload.py
monitor_speed = 115200
; Evita que o monitor deixe o ESP32 preso em estados indesejados ao abrir a serial.
monitor_dtr = 0
monitor_rts = 0
; Prioriza uploads mais ageis na bancada atual sem fixar a porta serial.
upload_speed = 115200
; Nao fixamos upload_port/monitor_port no repositório porque a COM pode mudar de maquina para maquina.
; Quando necessario, selecione a porta no VS Code ou use --upload-port/--monitor-port.
build_flags =
  -std=gnu++17
lib_deps =
  bblanchon/ArduinoJson@^6.21.5
  knolleary/PubSubClient@^2.8
